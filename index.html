<html><head>
    <link href="./index.css" rel="stylesheet">
    <link href="./myAccessoLogo.png" rel="icon" type="image/png">
    <link href="./myAccessoLogo.png" rel="shortcut icon" type="image/png">
    <script src="./authService/auth.js" defer=""></script>
    
    <script>

        let lStatus = 0

        async function webStartL(){
     if (lStatus == 0){
             if(await webStart(document.getElementById(`USR`).value,document.getElementById(`PSW`).value)){
                 document.getElementById("hT").innerHTML = "myAccesso   Session Active"
                 document.getElementById(`USR`).value = ""
                 document.getElementById(`PSW`).value = ""
                 lStatus = 1
                 document.getElementById("auth").innerHTML = "Sign Out"
             } else {
                 document.getElementById("hT").innerHTML = "Sign In Failed"
     
             }
            }else{
                SO()
                lStatus = 0
                    document.getElementById("auth").innerHTML = "Sign In"
                    document.getElementById(`USR`).value = ""
                    document.getElementById(`PSW`).value = ""
            }
         }
    
         async function checkL() {
            if (await checkL2()){
                document.getElementById("hT").innerHTML = "Active"
    
            } else {
                document.getElementById("hT").innerHTML = "Not Active"
    
            }
         } 
    
         async function SO() {
            
                logOut()
    
                document.getElementById("hT").innerHTML = "myAccesso"
    
            
         }

         async function localKey() {
            if (lStatus == 1 && document.getElementById(`PSW`).value != "" && document.getElementById(`USR`).value != ""){
                key(document.getElementById(`PSW`).value,document.getElementById(`USR`).value)
                webStartL();
            }
         }
     </script>
    
    
    </head>
    
    
    
    
    <body>
        <h1 id="hT" onclick="localKey()">myAccesso</h1>
    <div class="auth">
        <input placeholder="Username" id="USR">
    
    </div>
    <br>
    
    <div class="auth">
        <input placeholder="Password" type="Password" id="PSW">
    
    </div>
    
    <br>
    
    
    <div class="auth">
    <button onclick="webStartL()" id="auth">Login</button>
    </div>
    
    <br>
    <div class="auth">
        <button onclick="webStartL()" class="hidden">logOut</button>
        </div>
        
    
    <div class="auth">
    <button onclick="checkL()" class="hidden">Check</button>
    </div>
    
    <br>
    
    
 
    
    
    
    
    
    </body></html>
